name: CI

# Release gate: every push and PR must typecheck, pass the unit suite and
# produce a working build. Releases are blocked on this workflow succeeding.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: # reused by the release workflow so a tag cannot skip the gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the secret scan sees every commit

      # Release gate #1: no credentials may ever enter the repository.
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (main, preload, renderer)
        run: npm run build

      - name: Verify build output exists
        run: |
          test -f out/main/index.js || { echo "main bundle missing"; exit 1; }
          test -f out/preload/index.mjs || { echo "preload bundle missing"; exit 1; }
          test -f out/renderer/index.html || { echo "renderer bundle missing"; exit 1; }
          echo "build output verified"

      - name: Verify app icon is present
        run: |
          test -f resources/icon.icns || { echo "icon.icns missing"; exit 1; }
          test -f resources/icon.png || { echo "icon.png missing"; exit 1; }
          echo "icons verified"
