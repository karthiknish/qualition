name: Release

# Tag-driven releases. The CI gate runs first and the build job depends on it,
# so a tag can never publish something that does not typecheck, test and build.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0) — must match package.json'
        required: true

permissions:
  contents: write

jobs:
  gate:
    name: Release gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build & publish
    needs: gate
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "version $PKG matches tag"

      # The gate job runs on its own runner, so its build output does not
      # carry over — compile here before packaging.
      - name: Compile main, preload and renderer
        run: npm run build

      - name: Verify entry points exist before packaging
        run: |
          test -f out/main/index.js || { echo "::error::out/main/index.js missing"; exit 1; }
          test -f out/preload/index.mjs || { echo "::error::out/preload/index.mjs missing"; exit 1; }
          test -f out/renderer/index.html || { echo "::error::out/renderer/index.html missing"; exit 1; }

      - name: Package and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned build: skip Developer ID discovery so packaging cannot
          # stall retrying a certificate that is not available in CI.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish always

      - name: Summarise artifacts
        run: |
          echo "### Published artifacts" >> $GITHUB_STEP_SUMMARY
          ls -lh release/*.dmg release/*.zip 2>/dev/null | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY || true
